apiVersion: apps/v1
kind: Deployment
metadata: {name: git}
spec:
  replicas: 1
  selector: {matchLabels: {app: git}}
  template:
    metadata: {labels: {app: git}}
    spec:
      containers:
      - name: git
        image: ${GIT_IMAGE}
        imagePullPolicy: IfNotPresent
        env:
        - {name: GITEA__database__DB_TYPE, value: sqlite3}
        - {name: GITEA__security__INSTALL_LOCK, value: "true"}
        - {name: GITEA__server__PROTOCOL, value: https}
        - {name: GITEA__server__DOMAIN, value: git.default.svc.cluster.local}
        - {name: GITEA__server__ROOT_URL, value: "https://git.default.svc.cluster.local/"}
        - {name: GITEA__server__CERT_FILE, value: /tls/tls.crt}
        - {name: GITEA__server__KEY_FILE, value: /tls/tls.key}
        - {name: GITEA__server__DISABLE_SSH, value: "true"}
        - {name: GITEA__service__DISABLE_REGISTRATION, value: "true"}
        ports: [{containerPort: 3000}]
        volumeMounts: [{name: tls, mountPath: /tls}]
      volumes:
      - {name: tls, secret: {secretName: git-tls}}
