apiVersion: apps/v1
kind: Deployment
metadata: {name: mock-llm}
spec:
  replicas: 1
  selector: {matchLabels: {app: mock-llm}}
  template:
    metadata: {labels: {app: mock-llm}}
    spec:
      containers:
      - name: server
        image: docker.io/library/python:3.12-slim
        command: ["python", "-u", "/code/server.py"]
        ports: [{containerPort: 8443}]
        volumeMounts: [{name: code, mountPath: /code}, {name: tls, mountPath: /tls}]
      volumes:
      - {name: code, configMap: {name: mock-llm-code}}
      - {name: tls, secret: {secretName: mock-llm-tls}}
